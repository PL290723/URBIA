info:
  name: 04 Peticion por reportes propios
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/reportes?mios=true"
  params:
    - name: mios
      value: "true"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
