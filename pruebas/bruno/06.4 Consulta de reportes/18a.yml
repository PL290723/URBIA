http:
  method: GET
  url: "{{baseUrl}}/archivos/{{idFotoPropia}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200", () => expect(res.status).to.equal(200));
        test("es imagen", () => expect(res.headers["content-type"]).to.match(/^image\/(jpeg|png|webp)$/));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
