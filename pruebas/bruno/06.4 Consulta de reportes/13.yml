info:
  name: "13"
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{idOtro}}"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200", () => expect(res.status).to.equal(200));
        test("autor visible", () => expect(res.body.data.administrativo.autor.correo).to.include("@"));
        test("exacta", () => expect(res.body.data.ubicacion.aproximada).to.equal(false));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
