info:
  name: 03 Peticion por paginas
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/reportes?pagina=2&por_pagina=2"
  params:
    - name: pagina
      value: "2"
      type: query
    - name: por_pagina
      value: "2"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
