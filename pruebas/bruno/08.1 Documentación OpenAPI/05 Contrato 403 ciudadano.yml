info:
  name: "05 Contrato 403 ciudadano"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/estadisticas"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        // El contrato dice "Permisos: solo administrador" → 403 con el ejemplo components.responses.Prohibido
        test("403", () => expect(res.status).to.equal(403));
        test("cuerpo igual al documentado", () => expect(res.body).to.eql({
          success: false,
          error: { code: "PROHIBIDO", message: "No tienes permisos para realizar esta acción" }
        }));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
