info:
  name: "03 POST no permitido"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/openapi.yaml"

runtime:
  scripts:
    - type: tests
      code: |-
        test("405", () => expect(res.status).to.equal(405));
        test("METODO_NO_PERMITIDO", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("METODO_NO_PERMITIDO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
