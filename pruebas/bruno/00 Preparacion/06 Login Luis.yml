info:
  name: "06 Login Luis"
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "correo": "luis@test.mx",
        "contrasena": "NuevaClave123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) bru.setEnvVar("tokenOtro", res.body.data.token);
    - type: tests
      code: |-
        test("200", () => expect(res.status).to.equal(200));
        test("rol ciudadano", () => expect(res.body.data.usuario.rol).to.equal("ciudadano"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
