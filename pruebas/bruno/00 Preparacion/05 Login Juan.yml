info:
  name: "05 Login Juan"
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "correo": "juan@test.mx",
        "contrasena": "NuevaClave123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) bru.setEnvVar("tokenAdmin", res.body.data.token);
    - type: tests
      code: |-
        test("200", () => expect(res.status).to.equal(200));
        test("rol administrador", () => expect(res.body.data.usuario.rol).to.equal("administrador"));
        // Si falla: promover a juan con el UPDATE de pruebas/bruno/README.md y volver a correr.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
