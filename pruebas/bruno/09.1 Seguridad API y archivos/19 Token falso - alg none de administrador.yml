info:
  name: "19 Token falso - alg none de administrador"
  type: http
  seq: 19

http:
  method: GET
  url: "{{baseUrl}}/admin/usuarios"

runtime:
  scripts:
    - type: before-request
      code: |-
        const CryptoJS = require("crypto-js");
        const b64url = (p) => CryptoJS.enc.Base64.stringify(p).replace(/=+$/, "").replace(/\+/g, "-").replace(/\//g, "_");
        const parte = (obj) => b64url(CryptoJS.enc.Utf8.parse(JSON.stringify(obj)));
        const ahora = Math.floor(Date.now() / 1000);
        const claims = { rol: "administrador", sub: "1", iss: "urbia-api", iat: ahora, exp: ahora + 3600 };
        // Token sin firma: un servidor que no fija el algoritmo lo aceptaría
        req.setHeader("Authorization", "Bearer " + parte({ alg: "none", typ: "JWT" }) + "." + parte(claims) + ".");
    - type: tests
      code: |-
        test("401", () => expect(res.status).to.equal(401));
        test("NO_AUTORIZADO", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NO_AUTORIZADO");
        });
        test("WWW-Authenticate", () => expect(res.getHeader("www-authenticate")).to.equal('Bearer realm="urbia"'));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
