info:
  name: "38 Archivo - archivo vacio"
  type: http
  seq: 38

http:
  method: POST
  url: "{{baseUrl}}/reportes/{{idReporte091}}/archivos"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - "09.1 Seguridad API y archivos/archivos/vacio.jpg"
        contentType: image/jpeg
  auth:
    type: bearer
    token: "{{token091A}}"

runtime:
  scripts:
    - type: tests
      code: |-
        // El Content-Type que manda el cliente se ignora: se revisa el contenido real
        test("400", () => expect(res.status).to.equal(400));
        test("SOLICITUD_INVALIDA", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("SOLICITUD_INVALIDA");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
