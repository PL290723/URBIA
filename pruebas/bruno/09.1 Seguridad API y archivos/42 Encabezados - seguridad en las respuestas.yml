info:
  name: "42 Encabezados - seguridad en las respuestas"
  type: http
  seq: 42

http:
  method: GET
  url: "{{baseUrl}}/health"

runtime:
  scripts:
    - type: tests
      code: |-
        test("encabezados defensivos", () => {
          expect(res.getHeader("x-content-type-options")).to.equal("nosniff");
          expect(res.getHeader("x-frame-options")).to.equal("DENY");
          expect(res.getHeader("referrer-policy")).to.equal("no-referrer");
          expect(res.getHeader("content-security-policy")).to.contain("default-src 'none'");
          expect(res.getHeader("cache-control")).to.equal("no-store");
        });
        test("sin Origin no hay encabezados CORS", () => expect(res.getHeader("access-control-allow-origin")).to.be.undefined);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
