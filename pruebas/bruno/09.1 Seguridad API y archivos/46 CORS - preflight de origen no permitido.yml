info:
  name: "46 CORS - preflight de origen no permitido"
  type: http
  seq: 46

http:
  method: OPTIONS
  url: "{{baseUrl}}/reportes"
  headers:
    - name: Origin
      value: "http://sitio-malicioso.example"
    - name: Access-Control-Request-Method
      value: "POST"
    - name: Access-Control-Request-Headers
      value: "authorization"

runtime:
  scripts:
    - type: tests
      code: |-
        test("403", () => expect(res.status).to.equal(403));
        test("PROHIBIDO", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("PROHIBIDO");
        });
        test("sin Access-Control-Allow-Origin", () => expect(res.getHeader("access-control-allow-origin")).to.be.undefined);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
