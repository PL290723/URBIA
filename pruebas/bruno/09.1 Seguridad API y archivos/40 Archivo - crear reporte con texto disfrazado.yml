info:
  name: "40 Archivo - crear reporte con texto disfrazado"
  type: http
  seq: 40

http:
  method: POST
  url: "{{baseUrl}}/reportes"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - "09.1 Seguridad API y archivos/archivos/texto-disfrazado.jpg"
        contentType: image/jpeg
      - name: descripcion
        type: text
        value: "[09.1] Bache profundo frente a la escuela"
      - name: latitud
        type: text
        value: "20.522345"
      - name: longitud
        type: text
        value: "-100.812345"
      - name: origen_ubicacion
        type: text
        value: "manual"
  auth:
    type: bearer
    token: "{{token091A}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("415", () => expect(res.status).to.equal(415));
        test("FORMATO_NO_PERMITIDO", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("FORMATO_NO_PERMITIDO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
