info:
  name: "39 Archivo - imagen de 50x50 px"
  type: http
  seq: 39

http:
  method: POST
  url: "{{baseUrl}}/reportes/{{idReporte091}}/archivos"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - "09.1 Seguridad API y archivos/archivos/diminuta.png"
        contentType: image/png
  auth:
    type: bearer
    token: "{{token091A}}"

runtime:
  scripts:
    - type: tests
      code: |-
        // El Content-Type que manda el cliente se ignora: se revisa el contenido real
        test("422", () => expect(res.status).to.equal(422));
        test("IMAGEN_INVALIDA", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("IMAGEN_INVALIDA");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
