info:
  name: "43 Encabezados - X-Request-ID malicioso"
  type: http
  seq: 43

http:
  method: GET
  url: "{{baseUrl}}/health/live"
  headers:
    - name: X-Request-ID
      value: "falso\" usuario=admin"

runtime:
  scripts:
    - type: tests
      code: |-
        test("no se reutiliza: se genera uno nuevo", () => {
          const id = res.getHeader("x-request-id");
          expect(id).to.match(/^[0-9a-f]{16}$/);
          expect(id).to.not.contain("admin");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
