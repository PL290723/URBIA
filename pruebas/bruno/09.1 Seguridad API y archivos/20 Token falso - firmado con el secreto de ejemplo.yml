info:
  name: "20 Token falso - firmado con el secreto de ejemplo"
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/admin/usuarios"

runtime:
  scripts:
    - type: before-request
      code: |-
        const CryptoJS = require("crypto-js");
        const b64url = (p) => CryptoJS.enc.Base64.stringify(p).replace(/=+$/, "").replace(/\+/g, "-").replace(/\//g, "_");
        const parte = (obj) => b64url(CryptoJS.enc.Utf8.parse(JSON.stringify(obj)));
        const ahora = Math.floor(Date.now() / 1000);
        const claims = { rol: "administrador", sub: "1", iss: "urbia-api", iat: ahora, exp: ahora + 3600 };
        // Firmado con el JWT_SECRET público de .env.example. La API ya no arranca con
        // ese valor, así que este token "de administrador" debe rechazarse.
        const cabecera = parte({ alg: "HS256", typ: "JWT" });
        const datos = parte(claims);
        const firma = b64url(CryptoJS.HmacSHA256(cabecera + "." + datos, "CAMBIAR_por_un_secreto_largo_y_aleatorio_de_32+"));
        req.setHeader("Authorization", "Bearer " + cabecera + "." + datos + "." + firma);
    - type: tests
      code: |-
        test("401", () => expect(res.status).to.equal(401));
        test("NO_AUTORIZADO", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NO_AUTORIZADO");
        });
        test("WWW-Authenticate", () => expect(res.getHeader("www-authenticate")).to.equal('Bearer realm="urbia"'));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
