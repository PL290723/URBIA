info:
  name: "48 Fuerza bruta - login bloqueado tras intentos fallidos"
  type: http
  seq: 48

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "correo": "fuerza-bruta.091@ejemplo.com",
        "contrasena": "incorrecta"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        // VA AL FINAL: deja tu IP sin poder iniciar sesión durante LOGIN_VENTANA (5 min).
        // Manda LOGIN_MAX_INTENTOS (10) logins fallidos; este request es el siguiente.
        const axios = require("axios");
        const url = bru.getEnvVar("baseUrl") + "/auth/login";
        for (let i = 0; i < 10; i++) {
          // El axios del sandbox de Bruno lanza error con el 401 aunque se pida
          // validateStatus; el 401 es justo lo esperado, así que se ignora.
          try {
            await axios.post(url, { correo: "fuerza-bruta.091@ejemplo.com", contrasena: "incorrecta-" + i });
          } catch (e) {
            const status = e.response ? e.response.status : null;
            if (status !== 401 && status !== 429) throw e;
          }
        }
    - type: tests
      code: |-
        test("429", () => expect(res.status).to.equal(429));
        test("DEMASIADAS_SOLICITUDES", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("DEMASIADAS_SOLICITUDES");
        });
        test("Retry-After en segundos", () => {
          const espera = Number(res.getHeader("retry-after"));
          expect(espera).to.be.above(0);
          expect(espera).to.be.at.most(300);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
