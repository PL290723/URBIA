info:
  name: "41 Limite - JSON de mas de 64 KiB"
  type: http
  seq: 41

http:
  method: POST
  url: "{{baseUrl}}/auth/registro"
  body:
    type: json
    data: |-
      {
        "nombre": "se reemplaza antes de enviar",
        "correo": "grande.091@ejemplo.com",
        "contrasena": "Segura091!"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        // ~70 KiB: LimiteCuerpo lo corta antes de leerlo
        req.setBody({ nombre: "x".repeat(70 * 1024), correo: "grande.091@ejemplo.com", contrasena: "Segura091!" });
    - type: tests
      code: |-
        test("413", () => expect(res.status).to.equal(413));
        test("CUERPO_DEMASIADO_GRANDE", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("CUERPO_DEMASIADO_GRANDE");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
