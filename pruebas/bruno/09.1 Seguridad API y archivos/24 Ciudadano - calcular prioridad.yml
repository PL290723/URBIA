info:
  name: "24 Ciudadano - calcular prioridad"
  type: http
  seq: 24

http:
  method: POST
  url: "{{baseUrl}}/reportes/{{idReporte091}}/prioridad"
  auth:
    type: bearer
    token: "{{token091A}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("403", () => expect(res.status).to.equal(403));
        test("PROHIBIDO", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("PROHIBIDO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
