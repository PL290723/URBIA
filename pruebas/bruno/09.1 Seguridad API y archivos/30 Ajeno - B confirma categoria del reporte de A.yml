info:
  name: "30 Ajeno - B confirma categoria del reporte de A"
  type: http
  seq: 30

http:
  method: PUT
  url: "{{baseUrl}}/reportes/{{idReporte091}}/categoria"
  body:
    type: json
    data: |-
      {
        "id_categoria": 1
      }
  auth:
    type: bearer
    token: "{{token091B}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("404", () => expect(res.status).to.equal(404));
        test("NO_ENCONTRADO", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NO_ENCONTRADO");
        });
        // Mismo 404 que si no existiera: no revela que el recurso es de otro

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
