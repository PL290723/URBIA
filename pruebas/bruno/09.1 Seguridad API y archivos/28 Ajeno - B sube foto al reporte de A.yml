info:
  name: "28 Ajeno - B sube foto al reporte de A"
  type: http
  seq: 28

http:
  method: POST
  url: "{{baseUrl}}/reportes/{{idReporte091}}/archivos"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - "09.1 Seguridad API y archivos/archivos/foto-valida.jpg"
        contentType: image/jpeg
  auth:
    type: bearer
    token: "{{token091B}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("404", () => expect(res.status).to.equal(404));
        test("NO_ENCONTRADO", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NO_ENCONTRADO");
        });
        // Mismo 404 que si no existiera: no revela que el recurso es de otro

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
