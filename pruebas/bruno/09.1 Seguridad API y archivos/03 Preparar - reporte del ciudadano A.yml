info:
  name: "03 Preparar - reporte del ciudadano A"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/reportes"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - "09.1 Seguridad API y archivos/archivos/foto-valida.jpg"
        contentType: image/jpeg
      - name: descripcion
        type: text
        value: "[09.1] Bache profundo frente a la escuela"
      - name: latitud
        type: text
        value: "20.522345"
      - name: longitud
        type: text
        value: "-100.812345"
      - name: origen_ubicacion
        type: text
        value: "manual"
  auth:
    type: bearer
    token: "{{token091A}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setEnvVar("idReporte091", res.body.data.id_reporte);
          bru.setEnvVar("idArchivo091", res.body.data.foto.id_archivo);
        }
    - type: tests
      code: |-
        test("201", () => expect(res.status).to.equal(201));
        test("foto guardada", () => expect(res.body.data.foto.id_archivo).to.be.a("number"));
        test("no expone ruta ni hash del archivo", () => {
          expect(res.body.data.foto).to.not.have.property("ruta");
          expect(res.body.data.foto).to.not.have.property("sha256");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
