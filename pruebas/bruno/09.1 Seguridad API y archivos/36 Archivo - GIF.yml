info:
  name: "36 Archivo - GIF"
  type: http
  seq: 36

http:
  method: POST
  url: "{{baseUrl}}/reportes/{{idReporte091}}/archivos"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - "09.1 Seguridad API y archivos/archivos/animacion.gif"
        contentType: image/gif
  auth:
    type: bearer
    token: "{{token091A}}"

runtime:
  scripts:
    - type: tests
      code: |-
        // El Content-Type que manda el cliente se ignora: se revisa el contenido real
        test("415", () => expect(res.status).to.equal(415));
        test("FORMATO_NO_PERMITIDO", () => {
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("FORMATO_NO_PERMITIDO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
