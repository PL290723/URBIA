info:
  name: "00 Línea base de hoy"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/estadisticas?desde={{hoyLocal}}&hasta={{hoyLocal}}"
  params:
    - name: desde
      value: "{{hoyLocal}}"
      type: query
    - name: hasta
      value: "{{hoyLocal}}"
      type: query
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // "hoy" en hora de Celaya (México no tiene horario de verano: UTC-6)
        bru.setEnvVar("hoyLocal", new Date(Date.now() - 6 * 3600 * 1000).toISOString().slice(0, 10));
        // zona aleatoria para los reportes de esta corrida (~100 m entre sí)
        bru.setEnvVar("latStats", (20.5100 + Math.random() * 0.03).toFixed(6));
        bru.setEnvVar("lonStats", (-100.8700 + Math.random() * 0.03).toFixed(6));
    - type: tests
      code: |-
        const d = res.body.data;
        test("200", () => expect(res.status).to.equal(200));
        test("un día", () => { expect(d.filtros.dias).to.equal(1); expect(d.por_periodo.length).to.equal(1); });

        const suma = (xs) => xs.reduce((s, x) => s + x.total, 0);
        test("Σ por_estado = total", () => expect(suma(d.por_estado)).to.equal(d.total));
        test("Σ por_categoria = total", () => expect(suma(d.por_categoria)).to.equal(d.total));
        test("Σ por_periodo = total", () => expect(suma(d.por_periodo)).to.equal(d.total));
        test("4 estados en orden", () => expect(d.por_estado.map(e => e.estado)).to.eql(["pendiente", "en_revision", "en_proceso", "resuelto"]));
        test("sin_categoria al final", () => expect(d.por_categoria[d.por_categoria.length - 1].nombre).to.equal("sin_categoria"));

        bru.setEnvVar("statsBase", JSON.stringify({
          total: d.total,
          pendiente: (d.por_estado.find(x => x.estado === "pendiente") || { total: 0 }).total,
          en_revision: (d.por_estado.find(x => x.estado === "en_revision") || { total: 0 }).total,
          bache: (d.por_categoria.find(x => x.id_categoria === 1) || { total: 0 }).total,
          sin_cat: (d.por_categoria.find(x => x.id_categoria === null) || { total: 0 }).total
        }));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
