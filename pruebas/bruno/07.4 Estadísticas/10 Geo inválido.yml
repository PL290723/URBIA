info:
  name: "10 Geo inválido"
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/estadisticas?geo=si"
  params:
    - name: geo
      value: "si"
      type: query
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const e = res.body.error;
        test("400", () => expect(res.status).to.equal(400));
        test("VALIDACION_FALLIDA", () => expect(e.code).to.equal("VALIDACION_FALLIDA"));
        test("geo: booleano", () => expect(e.details.find(x => x.campo === "geo").regla).to.equal("booleano"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
