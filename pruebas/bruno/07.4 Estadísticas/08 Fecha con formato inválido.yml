info:
  name: "08 Fecha con formato inválido"
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/estadisticas?desde=16-11-2026"
  params:
    - name: desde
      value: "16-11-2026"
      type: query
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const e = res.body.error;
        test("400", () => expect(res.status).to.equal(400));
        test("VALIDACION_FALLIDA", () => expect(e.code).to.equal("VALIDACION_FALLIDA"));
        test("desde: fecha", () => expect(e.details.find(x => x.campo === "desde").regla).to.equal("fecha"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
