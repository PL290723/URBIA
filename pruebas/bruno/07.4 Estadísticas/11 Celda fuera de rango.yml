info:
  name: "11 Celda fuera de rango"
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/estadisticas?geo=true&celda_grados=5"
  params:
    - name: geo
      value: "true"
      type: query
    - name: celda_grados
      value: "5"
      type: query
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const e = res.body.error;
        test("400", () => expect(res.status).to.equal(400));
        test("VALIDACION_FALLIDA", () => expect(e.code).to.equal("VALIDACION_FALLIDA"));
        test("celda_grados: rango", () => expect(e.details.find(x => x.campo === "celda_grados").regla).to.equal("rango"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
