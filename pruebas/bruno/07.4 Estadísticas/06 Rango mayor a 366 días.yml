info:
  name: "06 Rango mayor a 366 días"
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/estadisticas?desde=2025-01-01&hasta=2026-11-16"
  params:
    - name: desde
      value: "2025-01-01"
      type: query
    - name: hasta
      value: "2026-11-16"
      type: query
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const e = res.body.error;
        test("400", () => expect(res.status).to.equal(400));
        test("VALIDACION_FALLIDA", () => expect(e.code).to.equal("VALIDACION_FALLIDA"));
        test("hasta: rango", () => expect(e.details.find(x => x.campo === "hasta").regla).to.equal("rango"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
