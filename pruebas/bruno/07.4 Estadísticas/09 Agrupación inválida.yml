info:
  name: "09 Agrupación inválida"
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/estadisticas?agrupacion=anio"
  params:
    - name: agrupacion
      value: "anio"
      type: query
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const e = res.body.error;
        test("400", () => expect(res.status).to.equal(400));
        test("VALIDACION_FALLIDA", () => expect(e.code).to.equal("VALIDACION_FALLIDA"));
        test("agrupacion: valor_permitido", () => expect(e.details.find(x => x.campo === "agrupacion").regla).to.equal("valor_permitido"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
