info:
  name: "12 Celda sin geo"
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/estadisticas?celda_grados=0.01"
  params:
    - name: celda_grados
      value: "0.01"
      type: query
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const e = res.body.error;
        test("400", () => expect(res.status).to.equal(400));
        test("VALIDACION_FALLIDA", () => expect(e.code).to.equal("VALIDACION_FALLIDA"));
        test("celda_grados: requiere_geo", () => expect(e.details.find(x => x.campo === "celda_grados").regla).to.equal("requiere_geo"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
