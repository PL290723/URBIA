info:
  name: "07 Desde posterior a hasta"
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/estadisticas?desde=2026-11-10&hasta=2026-11-01"
  params:
    - name: desde
      value: "2026-11-10"
      type: query
    - name: hasta
      value: "2026-11-01"
      type: query
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const e = res.body.error;
        test("400", () => expect(res.status).to.equal(400));
        test("VALIDACION_FALLIDA", () => expect(e.code).to.equal("VALIDACION_FALLIDA"));
        test("desde: orden", () => expect(e.details.find(x => x.campo === "desde").regla).to.equal("orden"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
