info:
  name: "R3 Bache 3"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/reportes"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - fotos/bache.jpeg
        contentType: image/jpeg
      - name: descripcion
        type: text
        value: "Bache para estadísticas 3"
      - name: latitud
        type: text
        value: "{{latStatsS}}"
      - name: longitud
        type: text
        value: "{{lonStats}}"
      - name: origen_ubicacion
        type: text
        value: "gps"
      - name: precision_m
        type: text
        value: "10"
      - name: id_categoria
        type: text
        value: "1"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setEnvVar("latStatsS", (Number(bru.getEnvVar("latStats")) + (-0.0003)).toFixed(6));
    - type: tests
      code: |-
        test("201", () => expect(res.status).to.equal(201));
        if (res.status === 201) { bru.setEnvVar("idStats3", res.body.data.id_reporte); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
