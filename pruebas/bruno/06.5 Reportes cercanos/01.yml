info:
  name: "01"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{idBase}}/cercanos"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const d = res.body.data;
        test("200", () => expect(res.status).to.equal(200));
        test("2 coincidencias", () => expect(d.total).to.equal(2));
        test("primero el duplicado", () => expect(d.coincidencias[0].id_reporte).to.equal(Number(bru.getEnvVar("idDup"))));
        test("nivel alta", () => expect(d.coincidencias[0].nivel).to.equal("alta"));
        test("menos de 10 m", () => expect(d.coincidencias[0].distancia_m).to.be.below(10));
        test("D2 otra categoría", () => expect(d.coincidencias[1].misma_categoria).to.equal(false));
        test("D3 fuera del radio", () => expect(d.coincidencias.map(c => c.id_reporte)).to.not.include(Number(bru.getEnvVar("idLejos"))));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
