info:
  name: D1 Duplicado
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/reportes"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - fotos/basura_dos.jpeg
        contentType: image/jpeg
      - name: descripcion
        type: text
        value: Bache frente a la escuela
      - name: latitud
        type: text
        value: "20.53005"
      - name: longitud
        type: text
        value: "-100.82002"
      - name: origen_ubicacion
        type: text
        value: gps
      - name: precision_m
        type: text
        value: "10"
      - name: id_categoria
        type: text
        value: "1"
  auth:
    type: bearer
    token: "{{tokenOtro}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("201", () => expect(res.status).to.equal(201));
        if (res.status === 201) { bru.setEnvVar("idDup", res.body.data.id_reporte); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
