info:
  name: "03 Login administrador demo"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "correo": "admin.demo@urbia.test",
        "contrasena": "{{demoAdminPass}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) bru.setEnvVar("tokenAdmin111", res.body.data.token);
    - type: tests
      code: |-
        // Requiere la variable de entorno demoAdminPass (la contrasena usada en cuentas-demo.ps1)
        test("200", () => expect(res.status).to.equal(200));
        test("rol administrador", () => expect(res.body.data.usuario.rol).to.equal("administrador"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
