info:
  name: "17 Consultar prioridad"
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{id111}}/prioridad"
  auth:
    type: bearer
    token: "{{tokenAdmin111}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const d = res.body.data;
        test("200", () => expect(res.status).to.equal(200));
        test("calculo con factores y vigencia", () => {
          expect(d.calculo).to.not.equal(null);
          expect(d.calculo.factores).to.have.lengthOf(4);
          expect(d.vigencia).to.have.property("desactualizado");
          expect(d.reporte.origen_prioridad).to.equal("calculada");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
