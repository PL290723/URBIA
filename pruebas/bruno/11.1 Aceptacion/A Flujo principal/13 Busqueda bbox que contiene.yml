info:
  name: "13 Busqueda bbox que contiene"
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/reportes?bbox=-100.85,20.50,-100.78,20.55"
  auth:
    type: bearer
    token: "{{tokenAdmin111}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const ids = res.body.data.elementos.map(r => r.id_reporte);
        test("200", () => expect(res.status).to.equal(200));
        test("incluye el reporte (Celaya)", () => expect(ids).to.include(Number(bru.getEnvVar("id111"))));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
