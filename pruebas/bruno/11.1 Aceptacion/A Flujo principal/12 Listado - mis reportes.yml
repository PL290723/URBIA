info:
  name: "12 Listado - mis reportes"
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/reportes?mios=true"
  auth:
    type: bearer
    token: "{{token111}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const ids = res.body.data.elementos.map(r => r.id_reporte);
        test("200", () => expect(res.status).to.equal(200));
        test("incluye el reporte de prueba", () => expect(ids).to.include(Number(bru.getEnvVar("id111"))));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
