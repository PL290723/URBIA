info:
  name: "02 Login ciudadano demo"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "correo": "ciudadano.demo@urbia.test",
        "contrasena": "DemoUrbia2026"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) bru.setEnvVar("token111", res.body.data.token);
    - type: tests
      code: |-
        test("200", () => expect(res.status).to.equal(200));
        test("token Bearer y rol ciudadano", () => { expect(res.body.data.tipo_token).to.equal("Bearer"); expect(res.body.data.usuario.rol).to.equal("ciudadano"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
