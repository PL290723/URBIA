info:
  name: "04 Perfil ciudadano"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/auth/perfil"
  auth:
    type: bearer
    token: "{{token111}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200", () => expect(res.status).to.equal(200));
        test("el rol sale del token", () => { expect(res.body.data.rol).to.equal("ciudadano"); expect(res.body.data.correo).to.equal("ciudadano.demo@urbia.test"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
