info:
  name: "01 Health completo"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const d = res.body.data;
        test("200 ok", () => { expect(res.status).to.equal(200); expect(d.status).to.equal("ok"); });
        test("PostgreSQL e IA activos", () => { expect(d.dependencias.database.estado).to.equal("activo"); expect(d.dependencias.inferencia.estado).to.equal("activo"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
