info:
  name: "27 Detalle del reporte sin IA"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{idSinIA111}}"
  auth:
    type: bearer
    token: "{{token111}}"

runtime:
  scripts:
    - type: tests
      code: |-
        // DESPUES: docker compose start inferencia
        const d = res.body.data;
        test("200: el reporte existe", () => { expect(res.status).to.equal(200); expect(d.estado).to.equal("pendiente"); });
        test("con su foto", () => expect(d.foto).to.be.an("object"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
