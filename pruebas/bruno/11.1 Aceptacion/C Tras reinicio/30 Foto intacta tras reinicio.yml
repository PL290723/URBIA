info:
  name: "30 Foto intacta tras reinicio"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/archivos/{{idArchivo111}}"
  auth:
    type: bearer
    token: "{{token111}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 JPEG", () => { expect(res.status).to.equal(200); expect(res.getHeader("content-type")).to.equal("image/jpeg"); });
        test("mismo tamano que antes del reinicio", () => expect(Number(res.getHeader("content-length"))).to.equal(Number(bru.getEnvVar("tamano111"))));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
