info:
  name: "03 POST gravedad 4"
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/reportes/{{idPrio}}/prioridad"
  body:
    type: json
    data: |-
      {
        "gravedad_observable": 4
      }
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const d = res.body.data;
        const suma = d.factores.filter(f => f.disponible).reduce((s, f) => s + f.aporte, 0);
        test("201", () => expect(res.status).to.equal(201));
        test("cobertura 0.7", () => expect(d.cobertura).to.equal(0.7));
        test("nivel asignado", () => expect(d.nivel).to.be.oneOf(["baja", "media", "alta"]));
        test("prioridad asignada", () => expect(d.prioridad_asignada).to.equal(true));
        test("~50 puntos (media)", () => { expect(d.puntuacion).to.be.within(49, 52); expect(d.nivel).to.equal("media"); });
        test("aportes = puntuación", () => expect(Math.abs(suma - d.puntuacion)).to.be.below(0.3));
        test("solo falta afectación", () => expect(d.factores_faltantes).to.eql(["afectacion_estimada"]));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
