info:
  name: "08 GET vigente"
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{idPrio}}/prioridad"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const d = res.body.data;
        test("200", () => expect(res.status).to.equal(200));
        test("prioridad calculada", () => expect(d.reporte.origen_prioridad).to.equal("calculada"));
        test("devuelve el último cálculo", () => expect(d.calculo.cobertura).to.equal(1));
        test("sigue vigente", () => { expect(d.vigencia.desactualizado).to.equal(false); expect(d.vigencia.motivos).to.eql([]); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
