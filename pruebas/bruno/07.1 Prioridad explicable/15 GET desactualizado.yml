info:
  name: "15 GET desactualizado"
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{idPrio}}/prioridad"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const d = res.body.data;
        test("200", () => expect(res.status).to.equal(200));
        test("desactualizado", () => expect(d.vigencia.desactualizado).to.equal(true));
        test("motivo: recurrencia 1 → 2", () => expect(d.vigencia.motivos.join(" | ")).to.include("1 → 2"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
