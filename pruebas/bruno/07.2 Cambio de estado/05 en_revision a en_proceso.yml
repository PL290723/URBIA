info:
  name: "05 en_revision a en_proceso"
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/reportes/{{idEstado}}/estado"
  body:
    type: json
    data: |-
      {"estado": "en_proceso"}
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const d = res.body.data;
        test("200", () => expect(res.status).to.equal(200));
        test("anterior en_revision", () => expect(d.estado_anterior).to.equal("en_revision"));
        test("nuevo en_proceso", () => expect(d.estado_nuevo).to.equal("en_proceso"));
        test("registra al administrador", () => expect(d.cambiado_por).to.be.a("number"));
        test("historial creado", () => expect(d.id_historial_estado).to.be.a("number"));
        test("estados siguientes", () => expect(d.estados_siguientes).to.eql(["resuelto"]));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
