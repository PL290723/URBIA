info:
  name: "01 pendiente a en_revision"
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/reportes/{{idEstado}}/estado"
  body:
    type: json
    data: |-
      {"estado": "en_revision"}
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const d = res.body.data;
        test("200", () => expect(res.status).to.equal(200));
        test("anterior pendiente", () => expect(d.estado_anterior).to.equal("pendiente"));
        test("nuevo en_revision", () => expect(d.estado_nuevo).to.equal("en_revision"));
        test("registra al administrador", () => expect(d.cambiado_por).to.be.a("number"));
        test("historial creado", () => expect(d.id_historial_estado).to.be.a("number"));
        test("estados siguientes", () => expect(d.estados_siguientes).to.eql(["en_proceso"]));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
