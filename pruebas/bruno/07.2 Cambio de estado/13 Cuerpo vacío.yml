info:
  name: "13 Cuerpo vacío"
  type: http
  seq: 15

http:
  method: PATCH
  url: "{{baseUrl}}/reportes/{{idEstadoSalto}}/estado"
  body:
    type: json
    data: |-
      {}
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("400", () => expect(res.status).to.equal(400));
        test("VALIDACION_FALLIDA", () => expect(res.body.error.code).to.equal("VALIDACION_FALLIDA"));
        test("falta estado", () => expect(res.body.error.details[0].campo).to.equal("estado"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
