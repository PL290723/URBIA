info:
  name: "03 Regresar a pendiente"
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/reportes/{{idEstado}}/estado"
  body:
    type: json
    data: |-
      {"estado": "pendiente"}
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const e = res.body.error;
        test("409", () => expect(res.status).to.equal(409));
        test("CONFLICTO", () => expect(e.code).to.equal("CONFLICTO"));
        test("estado actual en_revision", () => expect(e.details.estado_actual).to.equal("en_revision"));
        test("estados permitidos", () => expect(e.details.estados_permitidos).to.eql(["en_proceso"]));
        test("mensaje", () => expect(e.message).to.include("solo se permite: en_proceso"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
