info:
  name: "11 Salto no dejó rastro"
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{idEstadoSalto}}"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const d = res.body.data;
        test("200", () => expect(res.status).to.equal(200));
        test("sigue pendiente", () => expect(d.estado).to.equal("pendiente"));
        test("solo el registro de creación", () => expect(d.historial.length).to.equal(1));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
