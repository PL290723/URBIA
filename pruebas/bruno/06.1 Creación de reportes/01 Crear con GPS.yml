info:
  name: 01 Crear con GPS
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/reportes"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - fotos/basura_dos.jpeg
        contentType: image/jpeg
      - name: descripcion
        type: text
        value: Basura frente a la escuela
      - name: latitud
        type: text
        value: "20.5235"
      - name: longitud
        type: text
        value: "-100.8157"
      - name: origen_ubicacion
        type: text
        value: gps
      - name: precision_m
        type: text
        value: "12.5"
      - name: id_categoria
        type: text
        value: "3"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("201 creado", () => expect(res.status).to.equal(201));
        test("estado pendiente", () => expect(res.body.data.estado).to.equal("pendiente"));
        test("trae Location", () => expect(res.headers["location"]).to.match(/\/api\/v1\/reportes\/\d+/));
        test("trae foto", () => expect(res.body.data.foto.id_archivo).to.be.a("number"));
        bru.setEnvVar("idReporte", res.body.data.id_reporte);
        bru.setEnvVar("idArchivo", res.body.data.foto.id_archivo);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
