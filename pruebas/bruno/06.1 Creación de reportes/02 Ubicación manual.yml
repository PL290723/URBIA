info:
  name: 02 Ubicación manual
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/reportes"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - fotos/basura_dos.jpeg
        contentType: image/jpeg
      - name: descripcion
        type: text
        value: Basura frente a la escuela
      - name: latitud
        type: text
        value: "20.5235"
      - name: longitud
        type: text
        value: "-100.8157"
      - name: origen_ubicacion
        type: text
        value: manual
      - name: precision_m
        type: text
        value: "12.5"
        disabled: true
      - name: id_categoria
        type: text
        value: "3"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: test("201", () => expect(res.status).to.equal(201)); test("sin precisión", () => expect(res.body.data.ubicacion.precision_m).to.equal(null));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
