info:
  name: 08 GPS impreciso
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/reportes"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - fotos/basura_dos.jpeg
        contentType: image/jpeg
      - name: descripcion
        type: text
        value: Basura frente a la escuela
      - name: latitud
        type: text
        value: "20.5235"
      - name: longitud
        type: text
        value: "-100.8157"
      - name: origen_ubicacion
        type: text
        value: gps
      - name: precision_m
        type: text
        value: "250"
      - name: id_categoria
        type: text
        value: "3"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: test("400", () => expect(res.status).to.equal(400)); test("precisión", () => expect(res.body.error.details[0].regla).to.equal("precision_insuficiente"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
