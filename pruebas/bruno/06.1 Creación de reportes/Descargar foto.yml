info:
  name: Descargar foto
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/archivos/{{idArchivo}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200", () => expect(res.status).to.equal(200));
        test("es JPEG", () => expect(res.headers["content-type"]).to.equal("image/jpeg"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
