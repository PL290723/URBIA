info:
  name: "05 Archivo no imagen - texto disfrazado"
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/reportes"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - "09.1 Seguridad API y archivos/archivos/texto-disfrazado.jpg"
        contentType: image/jpeg
      - name: descripcion
        type: text
        value: "[09.3] Texto con extensi\u00f3n jpg"
      - name: latitud
        type: text
        value: "20.5235"
      - name: longitud
        type: text
        value: "-100.8157"
      - name: origen_ubicacion
        type: text
        value: "gps"
      - name: precision_m
        type: text
        value: "8.5"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        // Go lo rechaza por su contenido real: nunca se manda a Python
        test("415", () => expect(res.status).to.equal(415));
        test("FORMATO_NO_PERMITIDO", () => expect(res.body.error.code).to.equal("FORMATO_NO_PERMITIDO"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
