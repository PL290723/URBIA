info:
  name: "02 Historial como autor"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{idHist}}/historial"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const ev = res.body.data.eventos;
        test("200", () => expect(res.status).to.equal(200));
        test("3 eventos", () => expect(ev.length).to.equal(3));
        test("ve el rol del actor", () => expect(ev[1].actor.rol).to.equal("administrador"));
        test("no ve id ni nombre", () => { for (const e of ev) {
          expect(e.actor).to.not.have.property("id_usuario");
          expect(e.actor).to.not.have.property("nombre"); } });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
