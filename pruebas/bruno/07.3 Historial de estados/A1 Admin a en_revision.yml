  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/reportes/{{idHist}}/estado"
  body:
    type: json
    data: |-
      {"estado": "en_revision"}
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200", () => expect(res.status).to.equal(200));

settings:
