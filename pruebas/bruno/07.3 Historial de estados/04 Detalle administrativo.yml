info:
  name: "04 Detalle administrativo"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{idHist}}"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const h = res.body.data.historial;
        test("200", () => expect(res.status).to.equal(200));
        test("muestra la secuencia", () => expect(h.map(e => e.estado_nuevo)).to.eql(["pendiente", "en_revision", "en_proceso"]));
        test("con actor completo", () => { expect(h[1].actor.nombre).to.be.a("string"); expect(h[1].actor.rol).to.equal("administrador"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
