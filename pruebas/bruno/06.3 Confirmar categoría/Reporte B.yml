info:
  name: Reporte B
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/reportes"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - fotos/basura_tres.jpeg
        contentType: image/jpeg
      - name: descripcion
        type: text
        value: Basura frente a la escuela
      - name: latitud
        type: text
        value: "20.5235"
      - name: longitud
        type: text
        value: "-100.8157"
      - name: origen_ubicacion
        type: text
        value: gps
      - name: precision_m
        type: text
        value: "12.5"
      - name: id_categoria
        type: text
        value: "3"
        disabled: true
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: bru.setEnvVar("idB", res.body.data.id_reporte);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
