info:
  name: 00 Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/auth/login
  body:
    type: json
    data: |-
      {
        "correo": "ana@test.mx",
        "contrasena": "NuevaClave123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("token", res.body.data.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
