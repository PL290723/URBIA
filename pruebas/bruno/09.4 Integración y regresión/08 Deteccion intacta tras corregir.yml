info:
  name: "08 Deteccion intacta tras corregir"
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{id094}}"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const d = res.body.data, det = d.administrativo.deteccion;
        test("el reporte ya es basura", () => { expect(d.categoria.nombre).to.equal("basura"); expect(d.administrativo.origen_categoria).to.equal("corregida"); });
        test("la detección original NO cambió", () => {
          expect(det.id_deteccion).to.equal(Number(bru.getEnvVar("idDeteccion094")));
          expect(det.clase_detectada).to.equal("bache");
          expect(String(det.confianza)).to.equal(bru.getEnvVar("detConfianza094"));
          expect(det.fecha).to.equal(bru.getEnvVar("detFecha094"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
