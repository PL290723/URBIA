info:
  name: "10 Admin pendiente a en_revision"
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{baseUrl}}/reportes/{{id094}}/estado"
  body:
    type: json
    data: |-
      {
        "estado": "en_revision"
      }
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200", () => expect(res.status).to.equal(200));
        test("pendiente → en_revision", () => { expect(res.body.data.estado_anterior).to.equal("pendiente"); expect(res.body.data.estado_nuevo).to.equal("en_revision"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
