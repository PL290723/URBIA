info:
  name: "02 Estadisticas antes"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/estadisticas?desde={{hoy094}}&hasta={{hoy094}}"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // Hoy en hora de Celaya (AAAA-MM-DD), como cuenta la API las estadísticas.
        // El sandbox de Bruno no tiene Intl (toLocaleDateString con zona horaria),
        // así que se resta el desfase: Celaya es UTC-6 todo el año (sin horario de verano desde 2022).
        bru.setEnvVar("hoy094", new Date(Date.now() - 6 * 3600 * 1000).toISOString().slice(0, 10));
    - type: after-response
      code: |-
        if (res.status !== 200) throw new Error("Estadísticas respondió " + res.status + ": " + JSON.stringify(res.body));
        const d = res.body.data;
        const porEstado = Object.fromEntries(d.por_estado.map(e => [e.estado, e.total]));
        const porCat = Object.fromEntries(d.por_categoria.map(c => [c.nombre, c.total]));
        bru.setEnvVar("statsTotal094", String(d.total));
        bru.setEnvVar("statsResueltos094", String(porEstado.resuelto || 0));
        bru.setEnvVar("statsBasura094", String(porCat.basura || 0));
    - type: tests
      code: |-
        test("200", () => expect(res.status).to.equal(200));
        test("filtra solo hoy", () => expect(res.body.data.filtros.dias).to.equal(1));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
