info:
  name: "05 Persistencia - descargar foto"
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/archivos/{{idArchivo094}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 JPEG", () => { expect(res.status).to.equal(200); expect(res.getHeader("content-type")).to.equal("image/jpeg"); });
        test("mismo tamaño que el registrado", () => expect(Number(res.getHeader("content-length"))).to.equal(Number(bru.getEnvVar("tamano094"))));
        test("privada", () => expect(res.getHeader("cache-control")).to.equal("private, no-store"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
