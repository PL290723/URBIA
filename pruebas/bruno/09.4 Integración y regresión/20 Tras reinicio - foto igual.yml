info:
  name: "20 Tras reinicio - foto igual"
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/archivos/{{idArchivo094}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 JPEG", () => { expect(res.status).to.equal(200); expect(res.getHeader("content-type")).to.equal("image/jpeg"); });
        test("mismo tamaño en disco", () => expect(Number(res.getHeader("content-length"))).to.equal(Number(bru.getEnvVar("tamano094"))));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
