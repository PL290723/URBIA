info:
  name: "17 Estadisticas despues"
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/estadisticas?desde={{hoy094}}&hasta={{hoy094}}"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const d = res.body.data;
        const porEstado = Object.fromEntries(d.por_estado.map(e => [e.estado, e.total]));
        const porCat = Object.fromEntries(d.por_categoria.map(c => [c.nombre, c.total]));
        test("un reporte más hoy", () => expect(d.total).to.equal(Number(bru.getEnvVar("statsTotal094")) + 1));
        test("un resuelto más", () => expect(porEstado.resuelto).to.equal(Number(bru.getEnvVar("statsResueltos094")) + 1));
        test("una basura más", () => expect(porCat.basura).to.equal(Number(bru.getEnvVar("statsBasura094")) + 1));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
