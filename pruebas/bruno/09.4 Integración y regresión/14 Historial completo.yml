info:
  name: "14 Historial completo"
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{id094}}/historial"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const h = res.body.data;
        test("200 y solo lectura", () => { expect(res.status).to.equal(200); expect(h.solo_lectura).to.equal(true); });
        test("secuencia completa", () => expect(h.eventos.map(e => e.estado_nuevo)).to.eql(["pendiente", "en_revision", "en_proceso", "resuelto"]));
        test("los cambios los hizo el administrador", () => h.eventos.slice(1).forEach(e => expect(e.actor.rol).to.equal("administrador")));
        test("estado actual resuelto", () => expect(h.estado_actual).to.equal("resuelto"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
