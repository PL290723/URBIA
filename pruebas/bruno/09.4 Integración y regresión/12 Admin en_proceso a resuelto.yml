info:
  name: "12 Admin en_proceso a resuelto"
  type: http
  seq: 13

http:
  method: PATCH
  url: "{{baseUrl}}/reportes/{{id094}}/estado"
  body:
    type: json
    data: |-
      {
        "estado": "resuelto"
      }
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("200", () => expect(res.status).to.equal(200));
        test("en_proceso → resuelto", () => { expect(res.body.data.estado_anterior).to.equal("en_proceso"); expect(res.body.data.estado_nuevo).to.equal("resuelto"); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
