info:
  name: "06 Deteccion original - detalle administrativo"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{id094}}"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const det = res.body.data.administrativo.deteccion;
        bru.setEnvVar("detConfianza094", String(det.confianza));
        bru.setEnvVar("detFecha094", det.fecha);
    - type: tests
      code: |-
        const det = res.body.data.administrativo.deteccion;
        test("200", () => expect(res.status).to.equal(200));
        test("es la misma detección", () => expect(det.id_deteccion).to.equal(Number(bru.getEnvVar("idDeteccion094"))));
        test("detectó bache con modelo y versión", () => {
          expect(det.resultado).to.equal("detectado");
          expect(det.clase_detectada).to.equal("bache");
          expect(det.modelo).to.equal("urbia-yolo26s");
          expect(det.version_modelo).to.equal("1.0.0");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
