info:
  name: "19 Tras reinicio - reporte igual"
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/reportes/{{id094}}"
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        // El token de antes del reinicio sigue sirviendo (JWT firmado con el mismo secreto)
        const d = res.body.data, det = d.administrativo.deteccion;
        test("200", () => expect(res.status).to.equal(200));
        test("resuelto y basura", () => { expect(d.estado).to.equal("resuelto"); expect(d.categoria.nombre).to.equal("basura"); });
        test("misma ubicación", () => { expect(d.ubicacion.latitud).to.equal(Number(bru.getEnvVar("lat094"))); expect(d.ubicacion.longitud).to.equal(Number(bru.getEnvVar("lon094"))); });
        test("misma detección original", () => { expect(det.id_deteccion).to.equal(Number(bru.getEnvVar("idDeteccion094"))); expect(det.clase_detectada).to.equal("bache"); expect(det.fecha).to.equal(bru.getEnvVar("detFecha094")); });
        test("historial completo", () => expect(d.historial).to.have.length(4));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
