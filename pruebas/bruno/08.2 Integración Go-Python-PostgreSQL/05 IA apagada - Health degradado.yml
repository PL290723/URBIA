info:
  name: "05 IA apagada - Health degradado"
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/health"

runtime:
  scripts:
    - type: tests
      code: |-
        // ANTES: detén servidor_grpc.py (Ctrl+C) y espera ~15 s (INFERENCE_CHECK_INTERVAL)
        const d = res.body.data;
        test("200: la API sigue atendiendo", () => expect(res.status).to.equal(200));
        test("degradado", () => expect(d.status).to.equal("degradado"));
        test("inferencia caido", () => expect(d.dependencias.inferencia.estado).to.equal("caido"));
        test("PostgreSQL sigue activo", () => expect(d.dependencias.database.estado).to.equal("activo"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
