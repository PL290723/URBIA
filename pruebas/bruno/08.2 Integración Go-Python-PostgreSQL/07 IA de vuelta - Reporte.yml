info:
  name: "07 IA de vuelta - Reporte"
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/reportes"
  body:
    type: multipart-form
    data:
      - name: foto
        type: file
        value:
          - fotos/bache.jpeg
        contentType: image/jpeg
      - name: descripcion
        type: text
        value: "[IT 08.2] Python reiniciado"
      - name: latitud
        type: text
        value: "20.5235"
      - name: longitud
        type: text
        value: "-100.8157"
      - name: origen_ubicacion
        type: text
        value: gps
      - name: precision_m
        type: text
        value: "8.5"
  headers:
    - name: X-Request-ID
      value: it082-bruno-vuelta
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        // ANTES: vuelve a levantar servidor_grpc.py SIN reiniciar la API (el cliente gRPC se reconecta solo)
        test("201", () => expect(res.status).to.equal(201));
        test("vuelve a haber sugerencia", () => expect(res.body.data.sugerencia.estado).to.equal("sugerida"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
